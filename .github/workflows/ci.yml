name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ashianak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ashianak_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ashianak_test
      SECRET_KEY: ci-only-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Migration chain is reproducible
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (disposable ashianak_test)
        run: pytest -q
      - name: Lint
        run: ruff check app/ tests/
      - name: Format check
        run: ruff format --check app/ tests/
      - name: Type check
        run: mypy app/
      - name: Dependency audit (advisory)
        run: pip-audit --skip-editable
        continue-on-error: true
